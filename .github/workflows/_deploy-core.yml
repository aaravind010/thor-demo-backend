name: _deploy-core

# Reusable workflow for all three environments. Called only by deploy.yml.
# JFrog is the source of truth for built images: dev builds once and publishes there; qa/prod only ever pull by
# digest from JFrog, never from another environment's ECR, using the digest recorded in deploy/<service>/image.json.
# Doesn't write the manifest itself — just exposes digest/commit_id as outputs; deploy.yml's write-manifests job
# writes every changed service's manifest in one place, once per push, so concurrent writes never race.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        description: "dev, qa, or prod"
        required: true
        type: string
      mode:
        description: "deploy (build from source, dev only) or promote (read a manifest and move a pre-built artifact forward, qa/prod)"
        required: true
        type: string
      image_digest:
        description: "JFrog digest to promote/redeploy (manual rollback). Blank = read it from the upstream environment's manifest."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Max minutes to wait for the ECS deployment to stabilize."
        required: false
        type: number
        default: 30
      changed_services:
        description: "Comma-separated services also getting their own deploy job this run (e.g. \"task-api,intelligence-engine,\"). Blank means only this one service is deploying, so ecs-deploy syncs both siblings normally."
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: "Digest actually deployed for this service/environment. Blank if this call's stage didn't run or (for qa) wasn't approved."
        value: ${{ jobs['dev-deploy'].outputs.digest || jobs['qa-promote'].outputs.digest || jobs['prod-deploy'].outputs.digest }}
      commit_id:
        description: "Commit/tag identifier matching the digest above."
        value: ${{ jobs['dev-deploy'].outputs.commit_id || jobs['qa-promote'].outputs.commit_id || jobs['prod-deploy'].outputs.commit_id }}

# A workflow-level permissions block replaces the default set rather than extending it, so every scope left out
# here is none — including the contents: read that actions/checkout needs to fetch the repo.
permissions:
  id-token: write
  contents: read

jobs:
  dev-deploy:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        # inputs.service is the Terraform/ECS service key (thor-api/task-api/intelligence-engine); the actual
        # source folders are PascalCase (Thor.API/Thor.TaskAPI/Thor.IntelligenceEngine), so map here.
        working-directory: backend/services/${{ inputs.service == 'thor-api' && 'Thor.API' || inputs.service == 'task-api' && 'Thor.TaskAPI' || 'Thor.IntelligenceEngine' }}
    # Same mapping again: the `env` context isn't available inside `defaults`, and the
    # image build needs the folder as a path relative to the repo root, not as a cwd.
    env:
      SERVICE_DIR: backend/services/${{ inputs.service == 'thor-api' && 'Thor.API' || inputs.service == 'task-api' && 'Thor.TaskAPI' || 'Thor.IntelligenceEngine' }}
    outputs:
      digest: ${{ steps.digest.outputs.ref }}
      commit_id: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || inputs.environment == 'prod' && vars.PROD_AWS_ROLE_ARN }}
          region: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION || inputs.environment == 'prod' && vars.PROD_AWS_REGION }}

      - uses: ./.github/actions/jfrog-login
        id: jfrog
        with:
          jfrog_hostname: ${{ vars.JFROG_HOSTNAME }}
          jfrog_username: ${{ vars.jf_usr_thor }}
          jfrog_access_token: ${{ secrets.jf_api_thor }}

      - name: Set image URIs
        id: image
        run: |
          echo "jfrog_uri=${{ steps.jfrog.outputs.registry }}/${{ vars.JFROG_DOCKER_REPOSITORY }}/${{ inputs.service }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "ecr_uri=${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Restore & build (.NET)
        if: inputs.service != 'intelligence-engine'
        run: |
          dotnet restore
          dotnet build --no-restore -c Release -p:OpenApiGenerateDocumentsOnBuild=false

      # continue-on-error: fast feedback, not a gate.
      - name: Run unit tests (.NET)
        if: inputs.service != 'intelligence-engine'
        continue-on-error: true
        run: |
          if find . -iname '*.test.csproj' | grep -q .; then
            dotnet test --no-build -c Release
          else
            echo "No test project found, skipping."
          fi

      - name: Install uv (Python)
        if: inputs.service == 'intelligence-engine'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies (Python)
        if: inputs.service == 'intelligence-engine'
        run: uv sync --frozen

      - name: Generate gRPC stubs (Python)
        if: inputs.service == 'intelligence-engine'
        run: uv run python scripts/generate_grpc.py

      - name: Run unit tests (Python)
        if: inputs.service == 'intelligence-engine'
        continue-on-error: true
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            uv run pytest
          else
            echo "No tests found, skipping."
          fi

      # Build context is the repo root, not the service folder: every service reaches outside
      # its own directory (backend/shared/** project references, the shared proto/ contract),
      # and anything above the context is invisible to the build.
      # --no-cache avoids stale dependency layers.
      - name: Build image
        working-directory: ${{ github.workspace }}
        run: |
          docker build --no-cache \
            -f "${SERVICE_DIR}/Dockerfile" \
            -t "${{ steps.image.outputs.jfrog_uri }}" \
            .

      # Digest parsed from this push's own output, not `docker inspect`'s .RepoDigests[0] — that list isn't
      # guaranteed to be in push order, so a non-fresh Docker daemon (e.g. local testing, a reused runner) can
      # return a different registry's digest instead. Pinned digest, not just the mutable tag — what
      # downstream promotion actually pulls.
      - name: Publish to JFrog
        id: digest
        run: |
          PUSH_OUTPUT=$(docker push "${{ steps.image.outputs.jfrog_uri }}")
          echo "$PUSH_OUTPUT"
          DIGEST=$(echo "$PUSH_OUTPUT" | grep -oP 'digest: \Ksha256:[a-f0-9]+')
          echo "ref=${{ steps.jfrog.outputs.registry }}/${{ vars.JFROG_DOCKER_REPOSITORY }}/${{ inputs.service }}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Promote into dev's own ECR
        run: |
          docker tag "${{ steps.image.outputs.jfrog_uri }}" "${{ steps.image.outputs.ecr_uri }}"
          docker push "${{ steps.image.outputs.ecr_uri }}"

      - uses: ./.github/actions/ecs-deploy
        with:
          environment: dev
          service: ${{ inputs.service }}
          image_uri: ${{ steps.image.outputs.ecr_uri }}
          timeout_minutes: ${{ inputs.timeout_minutes }}
          changed_services: ${{ inputs.changed_services }}

  qa-deploy:
    if: inputs.environment == 'qa'
    runs-on: ubuntu-latest
    environment: qa-candidate
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      tag: ${{ steps.manifest.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || inputs.environment == 'prod' && vars.PROD_AWS_ROLE_ARN }}
          region: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION || inputs.environment == 'prod' && vars.PROD_AWS_REGION }}

      - uses: ./.github/actions/jfrog-login
        id: jfrog
        with:
          jfrog_hostname: ${{ vars.JFROG_HOSTNAME }}
          jfrog_username: ${{ vars.jf_usr_thor }}
          jfrog_access_token: ${{ secrets.jf_api_thor }}

      # Blank image_digest = read the digest dev's manifest recorded.
      - name: Read manifest / resolve digest to promote
        id: manifest
        run: |
          if [ -n "${{ inputs.image_digest }}" ]; then
            DIGEST="${{ inputs.image_digest }}"
            TAG="manual-$(echo "${DIGEST}" | sed 's/.*@sha256://' | cut -c1-12)"
            echo "Using explicitly provided digest: ${DIGEST}"
          else
            DIGEST=$(jq -r '.dev.digest' "deploy/${{ inputs.service }}/image.json")
            TAG=$(jq -r '.dev.commitId' "deploy/${{ inputs.service }}/image.json")
            echo "Resolved dev's manifest digest: ${DIGEST}"
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set candidate image URI
        id: image
        run: echo "candidate_uri=${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-qa:candidate-${{ steps.manifest.outputs.tag }}" >> "$GITHUB_OUTPUT"

      # Verifies the pull actually resolved to what image.json recorded, before it's retagged and pushed anywhere.
      - name: Pull from JFrog and push as a QA candidate
        run: |
          PULL_OUTPUT=$(docker pull "${{ steps.manifest.outputs.digest }}")
          echo "$PULL_OUTPUT"
          PULLED_DIGEST=$(echo "$PULL_OUTPUT" | grep -oP 'Digest: \Ksha256:[a-f0-9]+')
          MANIFEST_DIGEST=$(echo "${{ steps.manifest.outputs.digest }}" | grep -oP 'sha256:[a-f0-9]+')
          if [ "$PULLED_DIGEST" != "$MANIFEST_DIGEST" ]; then
            echo "::error::Pulled digest (${PULLED_DIGEST}) does not match deploy/${{ inputs.service }}/image.json's recorded digest (${MANIFEST_DIGEST})."
            exit 1
          fi
          echo "Verified: pulled image matches manifest digest ${MANIFEST_DIGEST}."

          docker tag "${{ steps.manifest.outputs.digest }}" "${{ steps.image.outputs.candidate_uri }}"
          docker push "${{ steps.image.outputs.candidate_uri }}"

      # The actually-running definition, not just the latest registered revision — what rollback needs.
      - name: Capture currently-running task definition
        id: previous
        run: |
          ARN=$(aws ecs describe-services --cluster "thor-qa" --services "${{ inputs.service }}" --query 'services[0].taskDefinition' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/ecs-deploy
        with:
          environment: qa
          service: ${{ inputs.service }}
          image_uri: ${{ steps.image.outputs.candidate_uri }}
          timeout_minutes: ${{ inputs.timeout_minutes }}
          changed_services: ${{ inputs.changed_services }}

      # Stub — see deployment_strategy_plan.md §8. Always passes for now.
      - name: Run integration tests against candidate
        run: echo "::warning::Real integration test suite not implemented yet — this step always passes for now."

      - name: Roll back QA to last stable revision
        if: failure()
        run: |
          aws ecs update-service \
            --cluster "thor-qa" \
            --service "${{ inputs.service }}" \
            --task-definition "${{ steps.previous.outputs.arn }}" \
            >/dev/null
          echo "Integration tests failed - rolled back to ${{ steps.previous.outputs.arn }}. Nothing promoted to QA's tagged image."

  qa-promote:
    needs: qa-deploy
    if: inputs.environment == 'qa' && needs['qa-deploy'].result == 'success'
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      # Re-exported so this workflow's own output stays blank until qa-promote (the approval-gated job) completes, not just qa-deploy.
      digest: ${{ needs['qa-deploy'].outputs.digest }}
      commit_id: ${{ needs['qa-deploy'].outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || inputs.environment == 'prod' && vars.PROD_AWS_ROLE_ARN }}
          region: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION || inputs.environment == 'prod' && vars.PROD_AWS_REGION }}

      - name: Promote tested candidate to the verified tag
        run: |
          CANDIDATE_URI="${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-qa:candidate-${{ needs['qa-deploy'].outputs.tag }}"
          VERIFIED_URI="${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-qa:${{ needs['qa-deploy'].outputs.tag }}"
          docker pull "${CANDIDATE_URI}"
          docker tag "${CANDIDATE_URI}" "${VERIFIED_URI}"
          docker push "${VERIFIED_URI}"

  prod-deploy:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      commit_id: ${{ steps.manifest.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || inputs.environment == 'prod' && vars.PROD_AWS_ROLE_ARN }}
          region: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION || inputs.environment == 'prod' && vars.PROD_AWS_REGION }}

      - name: Read manifest / resolve digest to promote
        id: manifest
        run: |
          if [ -n "${{ inputs.image_digest }}" ]; then
            DIGEST="${{ inputs.image_digest }}"
            TAG="manual-$(echo "${DIGEST}" | sed 's/.*@sha256://' | cut -c1-12)"
            echo "Using explicitly provided digest: ${DIGEST}"
          else
            DIGEST=$(jq -r '.qa.digest' "deploy/${{ inputs.service }}/image.json")
            TAG=$(jq -r '.qa.commitId' "deploy/${{ inputs.service }}/image.json")
            echo "Resolved qa's manifest digest: ${DIGEST}"
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set image URI
        id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-prod:${{ steps.manifest.outputs.tag }}" >> "$GITHUB_OUTPUT"

      # Verifies the pull actually resolved to what image.json recorded, before it's retagged and pushed anywhere.
      - name: Pull from JFrog and push into prod's ECR
        run: |
          PULL_OUTPUT=$(docker pull "${{ steps.manifest.outputs.digest }}")
          echo "$PULL_OUTPUT"
          PULLED_DIGEST=$(echo "$PULL_OUTPUT" | grep -oP 'Digest: \Ksha256:[a-f0-9]+')
          MANIFEST_DIGEST=$(echo "${{ steps.manifest.outputs.digest }}" | grep -oP 'sha256:[a-f0-9]+')
          if [ "$PULLED_DIGEST" != "$MANIFEST_DIGEST" ]; then
            echo "::error::Pulled digest (${PULLED_DIGEST}) does not match deploy/${{ inputs.service }}/image.json's recorded digest (${MANIFEST_DIGEST})."
            exit 1
          fi
          echo "Verified: pulled image matches manifest digest ${MANIFEST_DIGEST}."

          docker tag "${{ steps.manifest.outputs.digest }}" "${{ steps.image.outputs.uri }}"
          docker push "${{ steps.image.outputs.uri }}"

      - uses: ./.github/actions/ecs-deploy
        with:
          environment: prod
          service: ${{ inputs.service }}
          image_uri: ${{ steps.image.outputs.uri }}
          timeout_minutes: ${{ inputs.timeout_minutes }}
          changed_services: ${{ inputs.changed_services }}
