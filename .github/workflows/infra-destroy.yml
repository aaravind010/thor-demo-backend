name: Thor-Infra-Destroy

# Manual-only: terragrunt destroy for one environment, picked from a dropdown at dispatch time.
# Mirrors infra.yml's plan-terragrunt/apply-terragrunt split: plan-destroy computes and uploads a
# destroy plan (read-only, its logs are the review); destroy-terragrunt applies that exact saved
# plan under the same dev/qa GitHub Environment gate infra.yml's apply job uses (qa needs a
# reviewer, dev runs immediately) — applying a saved plan needs no -auto-approve either way.
# prod is deliberately not an option here — no destroy path for prod.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options: [dev, qa]
      lock_id:
        description: "Lock ID to force-unlock instead of destroying"
        required: false
        type: string
        default: ""

# One destroy per environment at a time; never cancels mid-run.
concurrency:
  group: infra-destroy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: "10.0.100"
  TF_TOKEN_sphereco_jfrog_io: ${{ secrets.jf_api_thor }}
  JFROG_HOSTNAME: ${{ vars.JFROG_HOSTNAME }}
  JFROG_STATE_BACKEND_REPOSITORY: ${{ vars.JFROG_STATE_BACKEND_REPOSITORY }}
  JFROG_ACCESS_TOKEN: ${{ secrets.jf_api_thor }}
  JFROG_USERNAME: ${{ vars.jf_usr_thor }}
  JFROG_LAMBDA_ARTIFACTS_REPOSITORY: ${{ vars.JFROG_LAMBDA_ARTIFACTS_REPOSITORY }}
  # root.hcl reads get_env("<ENV>_AWS_REGION"), no fallback; only the one matching
  # inputs.environment is ever actually read.
  DEV_AWS_REGION: ${{ vars.DEV_AWS_REGION }}
  QA_AWS_REGION: ${{ vars.QA_AWS_REGION }}

jobs:
  # Skipped entirely when lock_id is set — force-unlock below runs standalone instead.
  validate-branch:
    if: inputs.lock_id == ''
    runs-on: ubuntu-latest
    # workflow_dispatch allows any branch — enforce infra.yml's dev/qa <-> branch mapping.
    steps:
      - name: Enforce dev/qa branch mapping
        run: |
          case "${{ inputs.environment }}" in
            dev) EXPECTED="dev" ;;
            qa) EXPECTED="qa" ;;
          esac

          if [ "${{ github.ref_name }}" != "$EXPECTED" ]; then
            echo "::error::environment '${{ inputs.environment }}' must be dispatched from branch '$EXPECTED', not '${{ github.ref_name }}'." >&2
            exit 1
          fi

  plan-destroy:
    needs: validate-branch
    runs-on: ubuntu-latest
    # No environment: block here — read-only, nothing to gate. Its logs are what the approver
    # reviews before approving destroy-terragrunt below.
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # root.hcl's before_hook runs dotnet publish before plan/apply/destroy alike — needs the SDK
      # first, same reason plan-terragrunt in infra.yml does this.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: ./.github/actions/terragrunt-setup
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN }}
          region: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION }}
          working_directory: infra/envs/${{ inputs.environment }}

      - name: terragrunt plan -destroy
        run: terragrunt plan -destroy -no-color -out=/tmp/tfplan-destroy.binary 2>&1 | tee /tmp/plan-destroy-output.txt

      - name: Upload destroy plan file
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-destroy-${{ inputs.environment }}
          path: /tmp/tfplan-destroy.binary
          retention-days: 1

      # destroy-terragrunt applies this exact plan and must not rebuild — a fresh publish could
      # produce a byte-different zip (timestamps etc.) and make the saved plan stale.
      - name: Tar lambda function build zips
        working-directory: ${{ github.workspace }}
        run: |
          if compgen -G "backend/functions/*/*.zip" > /dev/null; then
            tar -czf /tmp/lambda-zips.tar.gz -C backend/functions .
          else
            echo "No lambda function zips found — nothing to tar (enable_authorizer/enable_ingestion likely off for this environment)."
          fi

      - name: Upload lambda function build zips
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zips-destroy-${{ inputs.environment }}
          path: /tmp/lambda-zips.tar.gz
          retention-days: 1
          if-no-files-found: ignore

  destroy-terragrunt:
    needs: plan-destroy
    runs-on: ubuntu-latest
    # Shared dev/qa Environments with infra.yml — only qa requires review.
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    env:
      # Applying the exact plan: plan-destroy already computed — no rebuild needed, see that job's
      # tar step comment.
      SKIP_LAMBDA_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terragrunt-setup
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN }}
          region: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION }}
          working_directory: infra/envs/${{ inputs.environment }}

      # /tmp, matching where plan-destroy wrote it.
      - name: Download destroy plan file
        uses: actions/download-artifact@v4
        with:
          name: tfplan-destroy-${{ inputs.environment }}
          path: /tmp

      - name: Download lambda function build zips
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lambda-zips-destroy-${{ inputs.environment }}
          path: /tmp

      - name: Untar lambda function build zips
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f /tmp/lambda-zips.tar.gz ]; then
            tar -xzf /tmp/lambda-zips.tar.gz -C backend/functions
          else
            echo "No lambda-zips artifact downloaded — nothing to extract."
          fi

      # Applies the exact destroy plan reviewed in plan-destroy's logs — fails as stale if state
      # changed since, instead of destroying something different than what was reviewed.
      - name: terragrunt destroy (apply saved plan)
        run: terragrunt apply -no-color /tmp/tfplan-destroy.binary

  force-unlock:
    if: inputs.lock_id != ''
    runs-on: ubuntu-latest
    # Shared dev/qa Environment with the destroy path above — qa still requires review for any
    # state-mutating operation, even one that isn't destroying resources.
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terragrunt-setup
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN }}
          region: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION }}
          working_directory: infra/envs/${{ inputs.environment }}

      - name: terragrunt force-unlock
        run: terragrunt force-unlock -force "${{ inputs.lock_id }}"
