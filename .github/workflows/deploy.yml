name: Deploy

# Entry point — decides environment/mode/which service(s) changed, then calls _deploy-core.yml.
# push to dev -> deploy (build from source); push to qa/main -> promote (reads the manifest carried by the
# dev->qa / qa->main promotion PR); pull_request -> preview only, via deploy-preview.yml; workflow_dispatch ->
# manual deploy/rollback. dorny/paths-filter picks source filters on push to dev, manifest filters on push to qa/main.

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, qa, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options: [dev, qa, prod]
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options: [thor-api, task-api, intelligence-engine]
      image_digest:
        description: "JFrog digest to deploy (blank = normal resolution for this environment's trigger)"
        required: false
        type: string

# Permissions don't propagate through a workflow_call boundary — re-declared here for _deploy-core.yml's use.
# pull-requests: read — dorny/paths-filter falls back to the GitHub API to list changed files on pull_request events.
permissions:
  id-token: write
  contents: write
  pull-requests: read

jobs:
  detect-changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      thor-api-source: ${{ steps.filter.outputs['thor-api-source'] }}
      thor-api-manifest: ${{ steps.filter.outputs['thor-api-manifest'] }}
      task-api-source: ${{ steps.filter.outputs['task-api-source'] }}
      task-api-manifest: ${{ steps.filter.outputs['task-api-manifest'] }}
      intelligence-engine-source: ${{ steps.filter.outputs['intelligence-engine-source'] }}
      intelligence-engine-manifest: ${{ steps.filter.outputs['intelligence-engine-manifest'] }}
    steps:
      # dorny/paths-filter needs full history to diff, or it fails open (matches everything).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # base defaults to main on push, which would diff dev/qa against main instead of their own last commit — force
      # it to the branch itself; left blank on pull_request, where the default (PR's base branch) is already correct.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            # proto/ generates each side of the Thor.Api <-> intelligence-engine gRPC contract
            # at build time (Grpc.Tools here, scripts/generate_grpc.py there), so a contract-only
            # change has to rebuild both or the two sides silently drift apart.
            thor-api-source:
              - 'backend/services/Thor.API/**'
              - 'backend/shared/**'
              - 'proto/**'
            thor-api-manifest:
              - 'deploy/thor-api/*.json'
            task-api-source:
              - 'backend/services/Thor.TaskAPI/**'
              - 'backend/shared/**'
            task-api-manifest:
              - 'deploy/task-api/*.json'
            # No backend/shared/** — that's .NET-only code this Python service never builds against.
            intelligence-engine-source:
              - 'backend/services/Thor.IntelligenceEngine/**'
              - 'proto/**'
            intelligence-engine-manifest:
              - 'deploy/intelligence-engine/*.json'

  context:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      mode: ${{ steps.set.outputs.mode }}
      thor-api: ${{ steps.set.outputs['thor-api'] }}
      task-api: ${{ steps.set.outputs['task-api'] }}
      intelligence-engine: ${{ steps.set.outputs['intelligence-engine'] }}
      changed_services: ${{ steps.set.outputs.changed_services }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="${{ github.ref_name }}"
          else
            BRANCH="${{ github.base_ref }}"
          fi

          case "$BRANCH" in
            qa)   ENVIRONMENT="qa";   MODE="promote" ;;
            main) ENVIRONMENT="prod"; MODE="promote" ;;
            *)    ENVIRONMENT="dev";  MODE="deploy" ;;
          esac

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE="preview"
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          # Preview and dev both read the source filter; qa/main read the manifest filter.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "$BRANCH" = "dev" ]; then
            THOR_API="${{ needs['detect-changes'].outputs['thor-api-source'] }}"
            TASK_API="${{ needs['detect-changes'].outputs['task-api-source'] }}"
            INTELLIGENCE_ENGINE="${{ needs['detect-changes'].outputs['intelligence-engine-source'] }}"
          else
            THOR_API="${{ needs['detect-changes'].outputs['thor-api-manifest'] }}"
            TASK_API="${{ needs['detect-changes'].outputs['task-api-manifest'] }}"
            INTELLIGENCE_ENGINE="${{ needs['detect-changes'].outputs['intelligence-engine-manifest'] }}"
          fi

          echo "thor-api=$THOR_API" >> "$GITHUB_OUTPUT"
          echo "task-api=$TASK_API" >> "$GITHUB_OUTPUT"
          echo "intelligence-engine=$INTELLIGENCE_ENGINE" >> "$GITHUB_OUTPUT"

          # Services getting their own deploy-<service> job this run — tells ecs-deploy which siblings to skip syncing.
          CHANGED=""
          [ "$THOR_API" = "true" ] && CHANGED="${CHANGED}thor-api,"
          [ "$TASK_API" = "true" ] && CHANGED="${CHANGED}task-api,"
          [ "$INTELLIGENCE_ENGINE" = "true" ] && CHANGED="${CHANGED}intelligence-engine,"
          echo "changed_services=$CHANGED" >> "$GITHUB_OUTPUT"

  deploy-thor-api:
    needs: context
    if: needs.context.outputs.mode != 'preview' && needs.context.outputs['thor-api'] == 'true'
    uses: ./.github/workflows/_deploy-core.yml
    with:
      service: thor-api
      environment: ${{ needs.context.outputs.environment }}
      mode: ${{ needs.context.outputs.mode }}
      changed_services: ${{ needs.context.outputs.changed_services }}
    secrets: inherit

  deploy-task-api:
    needs: context
    if: needs.context.outputs.mode != 'preview' && needs.context.outputs['task-api'] == 'true'
    uses: ./.github/workflows/_deploy-core.yml
    with:
      service: task-api
      environment: ${{ needs.context.outputs.environment }}
      mode: ${{ needs.context.outputs.mode }}
      changed_services: ${{ needs.context.outputs.changed_services }}
    secrets: inherit

  deploy-intelligence-engine:
    needs: context
    if: needs.context.outputs.mode != 'preview' && needs.context.outputs['intelligence-engine'] == 'true'
    uses: ./.github/workflows/_deploy-core.yml
    with:
      service: intelligence-engine
      environment: ${{ needs.context.outputs.environment }}
      mode: ${{ needs.context.outputs.mode }}
      changed_services: ${{ needs.context.outputs.changed_services }}
    secrets: inherit

  preview-thor-api:
    needs: context
    if: needs.context.outputs.mode == 'preview' && needs.context.outputs['thor-api'] == 'true'
    uses: ./.github/workflows/deploy-preview.yml
    with:
      service: thor-api
    secrets: inherit

  preview-task-api:
    needs: context
    if: needs.context.outputs.mode == 'preview' && needs.context.outputs['task-api'] == 'true'
    uses: ./.github/workflows/deploy-preview.yml
    with:
      service: task-api
    secrets: inherit

  preview-intelligence-engine:
    needs: context
    if: needs.context.outputs.mode == 'preview' && needs.context.outputs['intelligence-engine'] == 'true'
    uses: ./.github/workflows/deploy-preview.yml
    with:
      service: intelligence-engine
    secrets: inherit

  deploy-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_deploy-core.yml
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
      mode: ${{ inputs.environment == 'dev' && 'deploy' || 'promote' }}
      image_digest: ${{ inputs.image_digest }}
    secrets: inherit

  # Manifest writes happen once per push here, not once per service in _deploy-core.yml, so concurrent services
  # never race each other's writes. always(): a skipped deploy-<service> job isn't "success", so without this the
  # default needs: gate would skip this job too whenever fewer than all three services changed.
  write-manifests:
    needs: [context, deploy-thor-api, deploy-task-api, deploy-intelligence-engine]
    if: always() && needs.context.result == 'success' && needs.context.outputs.mode != 'preview'
    runs-on: ubuntu-latest
    steps:
      # uses: ./local/path still needs the repo checked out to resolve the action, even though manifest-write itself doesn't touch git.
      - uses: actions/checkout@v4

      - name: Write thor-api's manifest
        if: needs['deploy-thor-api'].outputs.digest != ''
        uses: ./.github/actions/manifest-write
        with:
          service: thor-api
          environment: ${{ needs.context.outputs.environment }}
          digest: ${{ needs['deploy-thor-api'].outputs.digest }}
          commit_id: ${{ needs['deploy-thor-api'].outputs.commit_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write task-api's manifest
        if: needs['deploy-task-api'].outputs.digest != ''
        uses: ./.github/actions/manifest-write
        with:
          service: task-api
          environment: ${{ needs.context.outputs.environment }}
          digest: ${{ needs['deploy-task-api'].outputs.digest }}
          commit_id: ${{ needs['deploy-task-api'].outputs.commit_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write intelligence-engine's manifest
        if: needs['deploy-intelligence-engine'].outputs.digest != ''
        uses: ./.github/actions/manifest-write
        with:
          service: intelligence-engine
          environment: ${{ needs.context.outputs.environment }}
          digest: ${{ needs['deploy-intelligence-engine'].outputs.digest }}
          commit_id: ${{ needs['deploy-intelligence-engine'].outputs.commit_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  write-manifest-manual:
    needs: deploy-manual
    if: github.event_name == 'workflow_dispatch' && needs['deploy-manual'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/manifest-write
        with:
          service: ${{ inputs.service }}
          environment: ${{ inputs.environment }}
          digest: ${{ needs['deploy-manual'].outputs.digest }}
          commit_id: ${{ needs['deploy-manual'].outputs.commit_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
