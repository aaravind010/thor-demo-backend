name: Tenant Migrations

# Tenant schema migrations, one phase per run (migrations/tenant/README.md): expand (add), migrate
# (backfill data), contract (drop). Generates the desired tenant schema from the EF model; the
# thor-<env>-tenant-migration state machine snapshots the live tenant schemas (ECS); this workflow
# plans the phase (Atlas needs a dev database, which only CI has), waits for a reviewer on the <env>
# environment, then lets the state machine apply. deploy.yml calls expand before any service deploy
# (a failed or rejected migration blocks the deploy) and migrate after them. Contract only runs when
# started by hand.
#
# pull_request runs only the generate job (desired state + planner tests) — no AWS access.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, qa, prod]
        required: true
      tenant:
        description: "'all' or one tenant_id"
        type: string
        default: all
        required: true
      phase:
        description: "expand (add), migrate (backfill data) or contract (drop — manual only)"
        type: choice
        options: [expand, migrate, contract]
        default: expand
        required: true
  workflow_call:
    inputs:
      environment:
        description: "dev, qa, or prod"
        type: string
        required: true
      tenant:
        description: "'all' or one tenant_id"
        type: string
        default: all
        required: false
      phase:
        description: "expand or migrate (contract only runs by hand)"
        type: string
        default: expand
        required: false
  pull_request:
    branches: [dev, qa, main]
    paths:
      - backend/shared/Thor.DataLayer/Data/Tenant/**
      - backend/shared/Thor.DataLayer/Models/Tenants/**
      - backend/shared/Thor.DataLayer/Thor.DataLayer.csproj
      - migrations/tenant/**
      - .config/dotnet-tools.json
      - .github/workflows/tenant-migrations.yml

permissions:
  id-token: write
  contents: read

concurrency:
  # One migration per environment at a time; never cancel one that may be mid-apply.
  group: tenant-migration-${{ inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with migrations/tenant/Dockerfile's ATLAS_VERSION.
  ATLAS_VERSION: v1.3.0
  ENVIRONMENT: ${{ inputs.environment }}
  TENANT: ${{ inputs.tenant || 'all' }}
  PHASE: ${{ inputs.phase || 'expand' }}
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  AWS_ROLE_ARN: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || inputs.environment == 'prod' && vars.PROD_AWS_ROLE_ARN }}
  # No fallback: a missing var must fail loudly, not silently target the wrong region.
  AWS_REGION: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION || inputs.environment == 'prod' && vars.PROD_AWS_REGION }}
  # Atlas's dev database (the postgres service container below) — CI only, ECS never diffs.
  DEV_URL: postgres://postgres:atlas@localhost:5432/postgres?sslmode=disable

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    outputs:
      skip: ${{ steps.applied.outputs.skip }}
      desired_sha: ${{ steps.desired.outputs.sha }}
      backfills_sha: ${{ steps.backfills.outputs.sha }}
      task_definition_arn: ${{ steps.taskdef.outputs.arn }}
    steps:
      - name: Check phase
        run: |
          case "$PHASE" in
            expand|migrate|contract) ;;
            *) echo "::error::phase must be expand, migrate or contract, not '$PHASE'"; exit 1 ;;
          esac
          # Contract drops columns: a person starts it, never a deploy.
          if [ "$PHASE" = contract ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "::error::contract runs only from Actions → Tenant Migrations → Run workflow"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: ariga/setup-atlas@v0
        with:
          version: ${{ env.ATLAS_VERSION }}

      - name: Planner tests
        run: |
          sh migrations/tenant/classify_test.sh
          sh migrations/tenant/backfills_test.sh
          sh migrations/tenant/contract_test.sh

      # Only data statements, named NNNN_<name>.sql, with a "-- requires:" line — checked here so a PR
      # gets the error before any tenant is planned. (Record and columns are per tenant, so empty.)
      - name: Check backfill scripts
        id: backfills
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/none"
          result=$(sh migrations/tenant/backfills.sh migrations/tenant/backfills "$RUNNER_TEMP/none" "$RUNNER_TEMP/none")
          echo "$result" | jq -r '.blocking[] | "::error::\(.id): \(.rule) \(.detail)"'
          echo "$result" | jq -e '.blocking | length == 0' > /dev/null
          # One hash for the whole set, names and contents — the migrate phase's skip marker.
          scripts=$(ls migrations/tenant/backfills/*.sql 2>/dev/null || true)
          echo "count=$(printf '%s' "$scripts" | grep -c . || true)" >> "$GITHUB_OUTPUT"
          echo "sha=$(for f in $scripts; do printf '%s  %s\n' "$(sha256sum < "$f" | cut -d' ' -f1)" "$(basename "$f")"; done \
            | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate desired state from the EF model
        id: desired
        working-directory: migrations/tenant
        run: |
          set -euo pipefail
          dotnet tool restore
          # dotnet ef doesn't restore the target project's NuGet packages before its design-time build.
          dotnet restore ../../backend/shared/Thor.DataLayer
          dotnet ef dbcontext script --project ../../backend/shared/Thor.DataLayer \
            --startup-project ../../backend/shared/Thor.DataLayer --context TenantDbContext --output ef.sql
          sed -i '1s/^\xEF\xBB\xBF//' ef.sql # EF writes a UTF-8 BOM
          atlas schema inspect --env ef --url env://src --var dev_url="$DEV_URL" \
            --format '{{ hcl . }}' > desired.hcl
          echo "sha=$(sha256sum desired.hcl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A script's "-- requires:" columns decide where it runs, so a typo would skip it on every tenant
      # and let the contract phase drop the data it should have copied. The PR that adds or changes a
      # script — the release that writes both columns — must have every one of them in its model.
      - name: Check backfill columns
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          changed=$(git diff --name-only --diff-filter=AM FETCH_HEAD HEAD -- 'migrations/tenant/backfills/*.sql')
          [ -n "$changed" ] || exit 0
          awk '/^table "/ { t = $2; gsub(/"/, "", t) } /^  column "/ { c = $2; gsub(/"/, "", c); print t "." c }' \
            migrations/tenant/desired.hcl > "$RUNNER_TEMP/model-columns.txt"
          bad=0
          for f in $changed; do
            for col in $(sed -n 's/^--[[:space:]]*requires:[[:space:]]*//p' "$f" | head -n 1 | tr ',' ' '); do
              grep -qxF "$col" "$RUNNER_TEMP/model-columns.txt" || {
                echo "::error file=$f::requires $col, which is not in the model — add the script in the release that has both columns"
                bad=1
              }
            done
          done
          exit "$bad"

      - uses: actions/upload-artifact@v4
        with:
          name: desired-state
          path: migrations/tenant/desired.hcl

      - name: ECR login
        if: github.event_name != 'pull_request'
        id: ecr
        uses: ./.github/actions/ecr-login
        with:
          role_arn: ${{ env.AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      - name: Resolve names
        if: github.event_name != 'pull_request'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=thor-${ENVIRONMENT}-tenant-migration-new-${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "FAMILY=thor-${ENVIRONMENT}-tenant-migration" >> "$GITHUB_ENV"

      # Only a fleet-wide run can be skipped: the state/ markers are written only when every tenant
      # completed the phase for exactly this model (expand) or this set of backfill scripts (migrate).
      - name: Check applied state
        if: github.event_name != 'pull_request'
        id: applied
        env:
          DESIRED_SHA: ${{ steps.desired.outputs.sha }}
          BACKFILLS_SHA: ${{ steps.backfills.outputs.sha }}
          BACKFILLS_COUNT: ${{ steps.backfills.outputs.count }}
        run: |
          set -euo pipefail
          marker() { aws s3 cp "s3://${BUCKET}/state/$1" - 2>/dev/null | jq -r ".$2 // empty" || true; }
          skip=false
          case "$PHASE" in
            expand)
              # Skip only once the pending-contract record exists too: the first fleet run has to write
              # it, or columns already pending contract would read as half of a rename.
              if [ "$TENANT" = all ] && [ "$(marker applied.json desiredSha256)" = "$DESIRED_SHA" ] \
                && aws s3 cp "s3://${BUCKET}/state/pending-contract.json" - > /dev/null 2>&1; then
                skip=true
                echo "Desired state ${DESIRED_SHA} is already applied to every tenant — nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
              fi ;;
            migrate)
              # deploy.yml calls migrate once the services are deployed: they now run this model, and
              # the contract phase's rollback window counts from here. Manual runs deploy nothing.
              if [ "$GITHUB_EVENT_NAME" = push ]; then
                jq -n --arg sha "$DESIRED_SHA" --arg git "$GITHUB_SHA" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  '{desiredSha256: $sha, gitSha: $git, deployedAt: $at}' \
                  | aws s3 cp --only-show-errors - "s3://${BUCKET}/state/deployed.json"
              fi
              if [ "$BACKFILLS_COUNT" -eq 0 ]; then
                skip=true
                echo "No backfill scripts — nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
              elif [ "$TENANT" = all ] && [ "$(marker backfills-applied.json backfillsSha256)" = "$BACKFILLS_SHA" ]; then
                skip=true
                echo "Every tenant has run these backfill scripts — nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
              fi ;;
            contract)
              # Fail here rather than after the snapshots: contract drops only what the running
              # services no longer use, so it plans against exactly the deployed model.
              deployed=$(marker deployed.json desiredSha256)
              if [ "$deployed" != "$DESIRED_SHA" ]; then
                echo "::error::contract plans only against the deployed model (${deployed:-none recorded yet}), not this ref's ${DESIRED_SHA} — run it on the deployed branch"
                exit 1
              fi ;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # Tag = hash of exactly what goes into the image, so an unchanged runner is never rebuilt
      # (the repo is IMMUTABLE).
      - name: Build and push runner image
        if: github.event_name != 'pull_request' && steps.applied.outputs.skip != 'true'
        working-directory: migrations/tenant
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          TAG=$(cat Dockerfile entrypoint.sh lib.sh inspect.sh apply.sh | sha256sum | cut -c1-16)
          IMAGE="${REGISTRY}/${FAMILY}-runner:${TAG}"
          if ! aws ecr describe-images --repository-name "${FAMILY}-runner" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            docker build --build-arg ATLAS_VERSION="${ATLAS_VERSION#v}" -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Terraform owns roles/env/sizing; CI only swaps the image into a new revision.
      - name: Register task definition revision
        if: github.event_name != 'pull_request' && steps.applied.outputs.skip != 'true'
        id: taskdef
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition \
            | jq --arg img "$IMAGE" '.containerDefinitions[0].image = $img
                | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
                   requiresCompatibilities, cpu, memory}' > taskdef.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

  plan:
    needs: generate
    if: github.event_name != 'pull_request' && needs.generate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Atlas's dev database for the diffs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    outputs:
      execution_arn: ${{ steps.start.outputs.execution_arn }}
    steps:
      - uses: actions/checkout@v4

      - uses: ariga/setup-atlas@v0
        with:
          version: ${{ env.ATLAS_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: desired-state
          path: migrations/tenant

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start execution
        id: start
        env:
          TASK_DEFINITION_ARN: ${{ needs.generate.outputs.task_definition_arn }}
          DESIRED_SHA: ${{ needs.generate.outputs.desired_sha }}
          BACKFILLS_SHA: ${{ needs.generate.outputs.backfills_sha }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=thor-${ENVIRONMENT}-tenant-migration-new-${ACCOUNT_ID}" >> "$GITHUB_ENV"

          # jq --arg escapes every value, so the tenant input can't break out of the JSON.
          INPUT=$(jq -n --arg runId "$RUN_ID" --arg tenant "$TENANT" --arg phase "$PHASE" --arg td "$TASK_DEFINITION_ARN" \
            --arg sha "$DESIRED_SHA" --arg bf "$BACKFILLS_SHA" --arg git "$GITHUB_SHA" \
            '{runId: $runId, tenant: $tenant, phase: $phase, taskDefinitionArn: $td, desiredSha256: $sha,
              backfillsSha256: $bf, gitSha: $git}')
          ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "arn:aws:states:${AWS_REGION}:${ACCOUNT_ID}:stateMachine:thor-${ENVIRONMENT}-tenant-migration" \
            --name "${PHASE}-${RUN_ID}" --input "$INPUT" --query executionArn --output text)
          echo "execution_arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "EXECUTION_ARN=$ARN" >> "$GITHUB_ENV"

      # Inspect is done when the state machine parks on WaitForPlanAndApproval (its token object
      # appears); anything else ending the execution first is a failure.
      - name: Wait for live-schema snapshots
        run: |
          set -uo pipefail
          while :; do
            if aws s3api head-object --bucket "$BUCKET" --key "runs/${RUN_ID}/approval-token.json" >/dev/null 2>&1; then
              exit 0
            fi
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)
            if [ "$STATUS" != "RUNNING" ]; then
              echo "Execution ${STATUS} before planning:"
              aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query '[error, cause]' --output text
              exit 1
            fi
            sleep 15
          done

      - name: Plan
        run: |
          set -euo pipefail
          mkdir -p run/state
          aws s3 cp --only-show-errors --recursive "s3://${BUCKET}/runs/${RUN_ID}/" run/ \
            --exclude "*" --include "tenants.json" --include "live/*"
          # Absent before the first fleet run / first deploy; plan.sh decides what that means per phase.
          for f in pending-contract.json deployed.json; do
            aws s3 cp --only-show-errors "s3://${BUCKET}/state/$f" "run/state/$f" 2>/dev/null || true
          done
          sh migrations/tenant/plan.sh "$PHASE" migrations/tenant/desired.hcl run
          aws s3 cp --only-show-errors --recursive run/ "s3://${BUCKET}/runs/${RUN_ID}/" \
            --exclude "*" --include "plans/*" --include "summary.json" --include "manifest.json" --include "plan-result.json" \
            --include "pending-contract.json"

      - name: Plan summary
        if: always() && hashFiles('run/summary.json') != ''
        run: |
          jq -r --arg env "$ENVIRONMENT" --arg phase "$PHASE" '
            def blocked: .blocking[] | "- ⛔ **\(.rule)** "
              + (if .sql then "`\(.table)`: `\(.sql)`" else "\(if .id then "`\(.id)` " else "" end)\(.detail)" end);
            "## Tenant migration plan — \($env) (\($phase))", "",
            if $phase == "expand" then
              "| Tenant | Expand (applied after approval) | Pending contract (not applied) | Blocking |",
              "|---|---|---|---|",
              (.[] | "| `\(.tenantId)` | \(.expand | length) | \(.deferred | length) | \(.blocking | length) |"),
              (.[] | select((.expand | length) + (.deferred | length) + (.blocking | length) > 0)
                | "", "### `\(.tenantId)`", blocked,
                  (.expand[]   | "- ✅ `\(.table)`: `\(.sql)`"),
                  (.deferred[] | "- 🕓 `\(.table)`: `\(.sql)`"))
            elif $phase == "migrate" then
              "| Tenant | Scripts to run | Done | Skipped | Blocking |",
              "|---|---|---|---|---|",
              (.[] | "| `\(.tenantId)` | \(.backfills.pending | length) | \(.backfills.done | length) | \(.backfills.skipped | length) | \(.blocking | length) |"),
              (.[] | select((.backfills.pending | length) + (.backfills.skipped | length) + (.blocking | length) > 0)
                | "", "### `\(.tenantId)`", blocked,
                  (.backfills.pending[] | "- ▶ `\(.)`"),
                  (.backfills.skipped[] | "- ↷ `\(.id)` — this tenant has no `\(.missing | join("`, `"))`"))
            else
              "| Tenant | Drop now (after approval) | Waiting | Blocking |",
              "|---|---|---|---|",
              (.[] | "| `\(.tenantId)` | \(.contract | length) | \(.waiting | length) | \(.blocking | length) |"),
              (.[] | select((.contract | length) + (.waiting | length) + (.blocking | length) > 0)
                | "", "### `\(.tenantId)`", blocked,
                  (.contract[] | "- ✅ `\(.sql)` (pending since \(.firstSeenAt))"),
                  (.waiting[]  | "- ⏳ `\(.sql)` — " + (if .reason == "too-new"
                      then "removed in the deployed release (since \(.firstSeenAt)); drops after the next model change is deployed"
                      else "no record of when it appeared" end)))
            end
          ' run/summary.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('run/summary.json') != ''
        with:
          name: tenant-migration-plan
          path: |
            run/plans/
            run/summary.json

      # Blocking changes fail the execution here; every other plan — including an empty one —
      # waits for a reviewer on the approve job before the state machine continues.
      - name: Decide
        run: |
          set -euo pipefail
          TOKEN=$(aws s3 cp "s3://${BUCKET}/runs/${RUN_ID}/approval-token.json" - | jq -er .taskToken)
          BLOCKED=$(jq -r .blockedTenants run/plan-result.json)
          if [ "$BLOCKED" -gt 0 ]; then
            aws stepfunctions send-task-failure --task-token "$TOKEN" --error BlockingChanges \
              --cause "${BLOCKED} tenant(s) have blocking changes — see the plan summary."
            echo "Plan has blocking changes — nothing applied." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  approve:
    # The phase in the name: the approval dialog shows what is being approved (contract drops columns).
    name: Approve ${{ inputs.phase || 'expand' }}
    needs: plan
    runs-on: ubuntu-latest
    # Required reviewers on the <env> environment are the manual approval gate.
    environment: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Release WaitForPlanAndApproval
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TOKEN=$(aws s3 cp "s3://thor-${ENVIRONMENT}-tenant-migration-new-${ACCOUNT_ID}/runs/${RUN_ID}/approval-token.json" - | jq -er .taskToken)
          aws stepfunctions send-task-success --task-token "$TOKEN" --task-output '{}'

  apply-wait:
    needs: [plan, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for apply
        env:
          EXECUTION_ARN: ${{ needs.plan.outputs.execution_arn }}
        run: |
          set -uo pipefail
          while :; do
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)
            [ "$STATUS" = "RUNNING" ] || break
            sleep 20
          done
          echo "Execution ${STATUS}"
          if [ "$STATUS" != "SUCCEEDED" ]; then
            aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query '[error, cause]' --output text
            exit 1
          fi

      # Under the plan in the run summary: what each tenant's apply did — the statements applied
      # (expand, contract) or each backfill's row count (migrate) — or the error that rolled it back.
      - name: Apply result
        if: always()
        env:
          EXECUTION_ARN: ${{ needs.plan.outputs.execution_arn }}
        run: |
          set -uo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="thor-${ENVIRONMENT}-tenant-migration-new-${ACCOUNT_ID}"
          STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)
          mkdir -p result && cd result
          aws s3 cp --only-show-errors "s3://${BUCKET}/runs/${RUN_ID}/manifest.json" manifest.json || echo '[]' > manifest.json
          for id in $(jq -r '.[].tenantId' manifest.json); do
            aws s3 cp --only-show-errors "s3://${BUCKET}/runs/${RUN_ID}/results/${id}.json" "${id}.json" 2> /dev/null || echo '{}' > "${id}.json"
            aws s3 cp --only-show-errors "s3://${BUCKET}/runs/${RUN_ID}/plans/${id}.sql" "${id}.sql" 2> /dev/null || : > "${id}.sql"
            jq -c --arg id "$id" --rawfile plan "${id}.sql" \
              '{tenantId: $id, result: ., plan: ($plan | split("\n") | map(select(length > 0)))}' "${id}.json"
          done | jq -s '.' > rows.json
          jq -r --arg env "$ENVIRONMENT" --arg phase "$PHASE" --arg status "$STATUS" '
            def cell: gsub("\\|"; "\\|") | if length > 110 then .[0:110] + "…" else . end;
            def changes:
              if $phase == "migrate" then
                (.result.output // []) | reduce .[] as $l ([];
                  if ($l | startswith("-- backfill ")) then . + [($l | ltrimstr("-- backfill ")) + " →"]
                  elif length > 0 then .[:-1] + [.[-1] + " " + $l] else . + [$l] end)
                | join("<br>")
              else .plan | map("`" + cell + "`") | join("<br>") end;
            "## Apply result — \($env) (\($phase)): \(if $status == "SUCCEEDED" then "✅" else "❌" end) \($status)", "",
            if length == 0 then "No tenant had anything to apply." else
              "| Tenant | Result | At | What changed |", "|---|---|---|---|",
              (.[] | "| `\(.tenantId)` | "
                + (if .result.status == "applied" then "✅ applied" elif .result.status == "failed" then "❌ rolled back"
                   else "⏹ not applied (stopped)" end)
                + " | \(.result.at // "-") | "
                + (if .result.status == "failed" then (.result.error // "" | cell) elif .result.status == "applied" then changes else "" end)
                + " |")
            end' rows.json >> "$GITHUB_STEP_SUMMARY"

  # Planning failed, or the approval was rejected / failed: stop the execution instead of leaving
  # it parked until the WaitForPlanAndApproval timeout. (Already-finished executions are fine.)
  cancel:
    needs: [plan, approve]
    if: >-
      always() && needs.plan.outputs.execution_arn != '' &&
      (needs.plan.result != 'success' || needs.approve.result != 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop execution
        env:
          EXECUTION_ARN: ${{ needs.plan.outputs.execution_arn }}
        run: |
          aws stepfunctions stop-execution --execution-arn "$EXECUTION_ARN" \
            --error MigrationNotApplied --cause "Planning failed, or the ${ENVIRONMENT} approval was rejected." || true
          echo "Migration not applied — execution stopped." >> "$GITHUB_STEP_SUMMARY"
          exit 1
