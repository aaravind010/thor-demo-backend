name: _deploy-preview

# PR-preview check for qa and main: they promote an already-built image (see _deploy-core.yml's qa-deploy/prod
# jobs), so this just confirms the code still compiles and unit tests pass — no Docker/AWS involved.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        # inputs.service is the Terraform/ECS service key (thor-api/task-api/intelligence-engine); the actual
        # source folders are PascalCase (Thor.API/Thor.TaskAPI/Thor.IntelligenceEngine), so map here.
        working-directory: backend/services/${{ inputs.service == 'thor-api' && 'Thor.API' || inputs.service == 'task-api' && 'Thor.TaskAPI' || 'Thor.IntelligenceEngine' }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore & build (.NET)
        if: inputs.service != 'intelligence-engine'
        run: |
          dotnet restore
          dotnet build --no-restore -c Release -p:OpenApiGenerateDocumentsOnBuild=false

      # continue-on-error: fast feedback, not a gate.
      - name: Run unit tests (.NET)
        if: inputs.service != 'intelligence-engine'
        continue-on-error: true
        run: |
          if find . -iname '*.test.csproj' | grep -q .; then
            dotnet test --no-build -c Release
          else
            echo "No test project found, skipping."
          fi

      - name: Install uv (Python)
        if: inputs.service == 'intelligence-engine'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies (Python)
        if: inputs.service == 'intelligence-engine'
        run: uv sync --frozen

      - name: Generate gRPC stubs (Python)
        if: inputs.service == 'intelligence-engine'
        run: uv run python scripts/generate_grpc.py

      - name: Run unit tests (Python)
        if: inputs.service == 'intelligence-engine'
        continue-on-error: true
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            uv run pytest
          else
            echo "No tests found, skipping."
          fi
